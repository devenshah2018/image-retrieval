<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Image retrieval{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="page-{{ page_id | default('app') }}">
  <div class="app-shell">
    <aside class="sidebar" aria-label="Application">
      <div class="sidebar-inner">
        <a href="{{ url_for('main.index') }}" class="brand">
          <div>
            <div class="brand-title">AI-Powered Image Retrieval</div>
          </div>
        </a>

        <nav class="side-nav" aria-label="Primary">
          <a href="{{ url_for('main.index') }}" class="side-nav-link {% if page_id == 'query' %}is-active{% endif %}">
            <span class="side-nav-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            </span>
            Query
          </a>
          <a href="{{ url_for('main.train_page') }}" class="side-nav-link {% if page_id == 'train' %}is-active{% endif %}">
            <span class="side-nav-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
            </span>
            Train
          </a>
          <a href="{{ url_for('main.dataset_page') }}" class="side-nav-link {% if page_id == 'dataset' %}is-active{% endif %}">
            <span class="side-nav-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <ellipse cx="12" cy="12" rx="4" ry="10"/>
                <path d="M2 12h20"/>
                <path d="M12 2a15.3 15.3 0 0 1 0 20"/>
                <path d="M12 2a15.3 15.3 0 0 0 0 20"/>
              </svg>
            </span>
            Dataset
          </a>
        </nav>

        <div class="sidebar-bottom">
          <nav class="side-nav side-nav--footer" aria-label="Resources">
            <a href="{{ url_for('main.notebooks_page') }}" class="side-nav-link {% if page_id == 'notebooks' %}is-active{% endif %}">
              <span class="side-nav-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M8 7h8"/><path d="M8 11h6"/></svg>
              </span>
              Notebooks
            </a>
          </nav>
          <div class="sidebar-footer muted small">
            <p class="sidebar-footer__by">Created By Deven Shah</p>
            <div class="sidebar-footer__social">
              <a
                href="https://github.com/devenshah2018"
                class="sidebar-footer__icon"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Deven Shah on GitHub"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
              </a>
              <a
                href="https://www.linkedin.com/in/deven-a-shah/"
                class="sidebar-footer__icon"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Deven Shah on LinkedIn"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
              </a>
              <a
                href="https://deven-shah.com/"
                class="sidebar-footer__icon"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Deven Shah — portfolio"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              </a>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <div class="main-wrap">
      <main class="main">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <div id="toast-root" class="toast-root" aria-live="polite" aria-relevant="additions"></div>

  {% if not faiss_import_ok %}
  <template id="faiss-toast-template">
    <div class="toast toast--error toast--persistent toast--wide" role="alert">
      <button type="button" class="toast-dismiss" aria-label="Dismiss">&times;</button>
      <div class="toast-body toast-body--faiss">
        <p class="toast-lead"><strong>faiss is not importable</strong> in this Python process, so Search will not work.</p>
        <p class="mono-inline">{{ flask_python_executable }}</p>
        <p class="toast-faiss-hint">From a shell: <code>conda activate w7-image-retrieval</code> then <code>./run_app.sh</code> or <code>python run_flask.py</code> (these use <code>$CONDA_PREFIX/bin/python</code> when set, even if <code>python</code> on PATH is pyenv). In the IDE, choose the conda env as the Python interpreter.</p>
      </div>
    </div>
  </template>
  {% endif %}

  <script type="application/json" id="flash-data">{{ get_flashed_messages(with_categories=true) | tojson }}</script>
  <script type="application/json" id="page-toasts">{% block initial_toasts %}[]{% endblock %}</script>
  <script src="{{ url_for('static', filename='js/toasts.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
